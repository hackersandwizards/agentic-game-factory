          const q = (n + 8) * m;
          const qx = Math.round(T.x0 + 320 * G - SAFE - q);
          const qy = Math.round(gy(167) - q / 2);
          ctx.globalAlpha = al;
          ctx.fillStyle = "#FFFFFF";
          ctx.fillRect(qx, qy, q, q);
          ctx.fillStyle = "#000000";
          for (let r = 0; r < n; r++)
            for (let c = 0; c < n; c++)
              if (QR.isDark(r, c)) ctx.fillRect(qx + (c + 4) * m, qy + (r + 4) * m, m, m);
          ctx.globalAlpha = 1;
        }
        // The title screen's own life while the end card shows, beyond what the game's title
        // scene animates: the hearth flickers and the string lights twinkle. a: 0..1, gone by
        // the last frame, which is the game's title screen.
        const HEARTH = [640, 455];
        function titleLife(T, st, a) {
          if (a <= 0) return;
          const t = real(st);
          const R = scr(T, { x: HEARTH[0], y: HEARTH[1], w: 0, h: 0 });
          const r = 120 * T.s;
          const fl = 0.55 + 0.25 * Math.sin(t * 9.1) + 0.2 * Math.sin(t * 23.7 + 1);
          const g = ctx.createRadialGradient(R.x, R.y, 0, R.x, R.y, r);
          g.addColorStop(0, `rgba(255,160,60,${0.2 * fl * a})`);
          g.addColorStop(1, "rgba(255,160,60,0)");
          ctx.save();
          ctx.globalCompositeOperation = "lighter";
          ctx.fillStyle = g;
          ctx.fillRect(R.x - r, R.y - r, 2 * r, 2 * r);
          ctx.restore();
          const z = CELLD * T.s;
          ctx.globalAlpha = a;
          lit(t).forEach(([x, y, c]) => {
            ctx.fillStyle = c;
            ctx.fillRect(T.x0 + Math.round(x / CELLD) * z, T.y0 + Math.round(y / CELLD) * z, z, z);
          });
          ctx.globalAlpha = 1;
        }
        // End card: the greeting, the nod and the kit invitation, in one panel right of the
        // wizard and his staff, under the LEVEL board and above the strip, so he and the boards stay
        // whole; the strip carries the QR code and the mail the link. Every line is at least the
        // phone minimum (32 px glyphs): the greeting at 40 where it fits on one line, and a line
        // too long breaks at spaces. a: 0..1 its rise from below, al its opacity.
        const CARD = { x0: 1032, x1: 1824, top: 216, y1: 900, pad: 24 };
        const CARD_ROOM = CARD.x1 - CARD.x0 - 96;
        const cardLines = () =>
          [
            [V.customerName, 4, COL.amber],
            [V.greeting, 5, COL.snow],
            [V.nod, 4, COL.amber],
            [V.kitLine, 4, COL.green],
          ]
            .filter(([s]) => s)
            .flatMap(([s, k, color]) =>
              measure(s, 32, k) <= CARD_ROOM
                ? [[s, k, color]]
                : breakLines(s.split(" "), " ", (l) => measure(l, 32, 4) <= CARD_ROOM).map((t) => [
                    t,
                    4,
                    color,
                  ]),
            );
        // the line pitch: the glyphs (8 font pixels) plus three font pixels of leading
        const cardH = (lines) => lines.reduce((h, [, k]) => h + 11 * k, 0) + 2 * CARD.pad;
        function endCard(a, al = 1) {
          if (a <= 0 || al <= 0) return;
          if (al < 1) return faded(al, () => endCard(a));
          const lines = cardLines();
          const h = cardH(lines);
          const py0 = Math.round(CARD.y1 - h + (1080 - CARD.y1 + h) * (1 - a));
          ctx.save();
          ctx.beginPath();
          ctx.rect(0, 0, 1920, CARD.y1);
          ctx.clip();
          plate(CARD.x0, py0, CARD.x1 - CARD.x0, h, COL.night, COL.teal, 6, 0.94);
          let y = py0 + CARD.pad;
          lines.forEach(([s, k, color]) => {
            y += 11 * k;
            txt(s, CARD.x0 + 48, y - k, { k, color });
          });
          ctx.restore();
        }
        // the build reaches 100 % on the whole room, the room holds clean, then one dissolve,
        // block by block, into the game's title screen with its board texts already lit: nothing
        // of the customer's room and nothing of the title screen ever shows twice, and no board
        // ever shows empty
        const PRESS_AT = 4.0;
        const DISSOLVE = 1.2;
        const TITLE_HOLD = 1.0;
        // the title's extra life is gone this much story time before the film's end: by the last
        // frame
        const OUTRO_FADE_END = 0.05;
        // the end card's story time from its rise to the start of its fade
        const CARD_HOLD = 3.4;
        // f draws onto canvas cv, cleared first, instead of the frame
        const into = (cv, f) => {
          const main = ctx;
          ctx = cv.getContext("2d");
          ctx.imageSmoothingEnabled = false;
          ctx.clearRect(0, 0, cv.width, cv.height);
          f();
          ctx = main;
        };
        const hubCv = document.createElement("canvas");
        hubCv.width = 1920;
        hubCv.height = 1080;
        const zoomCv = document.createElement("canvas");
        zoomCv.width = 1920;
        zoomCv.height = 1080;
        const mosaicCv = document.createElement("canvas");
        mosaicCv.width = 320;
        mosaicCv.height = 180;
        // hubT shows whole half steps of zoom, so a camera move pans at a fixed zoom and
        // crosses each step with a mosaic over 8 frames instead of a one-frame jump; the camera
        // holds still through it (a step lies between two stop keys with the same centre).
        // zoomSteps: [time, zoom before, zoom after] per step of cam between a and b.
        const ZOOM_W = 8 / 30 / PACE;
        const zoomSteps = (cam, a, b) => {
          const q = (u) => Math.max(1, Math.round(cam(u)[2] * 2) / 2);
          const out = [];
          for (let u = a; u < b; u += 0.001) if (q(u + 0.001) !== q(u)) out.push([u, q(u), q(u + 0.001)]);
          return out;
        };
        // The hub through cam at u, hub(T, extra) drawing it with T; inside a step both zooms
        // draw and the build reading draws once over them, gliding between its two places.
        // Returns the T of the unrounded camera.
        function hubThrough(cam, steps, u, hub) {
          const [cx, cy, z] = cam(u);
          const T = hubT(cx, cy, z);
          const st = steps.find(([su]) => Math.abs(u - su) < ZOOM_W / 2);
          if (!st) {
            hub(T, {});
            return T;
          }
          const [su, z0, z1] = st;
          const p = (u - su + ZOOM_W / 2) / ZOOM_W;
          const [T0, T1] = [hubT(cx, cy, z0), hubT(cx, cy, z1)];
          let tip = null;
          const onTip = (_, tp, o) => (tip = [tp, o]);
          // the console's mosaic: the whole picture coarsens to blocks of up to four units and
          // resolves at the new zoom, the swap at its coarsest; block sizes divide the frame
          into(zoomCv, () => hub(p < 0.5 ? T0 : T1, { onTip }));
          const B = [6, 12, 24, 24, 24, 24, 12, 6][clamp(Math.floor(p * 8), 0, 7)];
          const [mw, mh] = [1920 / B, 1080 / B];
          const g = mosaicCv.getContext("2d");
          g.imageSmoothingEnabled = true;
          g.imageSmoothingQuality = "high";
          g.clearRect(0, 0, mw, mh);
          g.drawImage(zoomCv, 0, 0, mw * B, mh * B, 0, 0, mw, mh);
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(mosaicCv, 0, 0, mw, mh, 0, 0, mw * B, mh * B);
          if (tip)
            buildTip(
              {
                s: lerp(T0.s, T1.s, p),
                x0: lerp(T0.x0, T1.x0, p),
                y0: lerp(T0.y0, T1.y0, p),
              },
              ...tip,
            );
          return T;
        }
        function sceneHubOutro(t) {
          const o = t - CUTS[3];
          const [px, py] = point("portal");
          // the whole room, the camera still from the portal's iris to the last frame
          const T = hubT(hubImg.width / 2, hubImg.height / 2, 1.0);
          const d = clamp((o - PRESS_AT) / DISSOLVE);
          const hub = (T) =>
            drawHub(T, t, {
              // the belt stops with its gifts where the title picture paints them
              beltT: Math.min(o, 0.6) - 0.6,
              // the reading goes 0.1 s before the press: the whole room shows clean for the
              // poster (scripts/greeting.sh takes it at 62.6 s, (CUTS[3] + 3.95) * PACE)
              tips: o > 1.2 && o < PRESS_AT - 0.1,
              progress: clamp((o - 1.4) / 0.8),
              burst: o - 2.2,
            });
          const e0 = CUTS[3] + PRESS_AT + DISSOLVE + 0.4 + TITLE_HOLD;
          if (d <= 0) hub(T);
          else {
            drawHub(T, t, { plain: true });
            gameTitle(T, t, 1);
            if (d < 1) {
              into(hubCv, () => hub(T));
              // blocks go in a wave from the centre outward, each at its own moment
              const B = 24;
              for (let by = 0; by < 1080 / B; by++)
                for (let bx = 0; bx < 1920 / B; bx++) {
                  const r = Math.hypot(bx - 40, (by - 22.5) * 1.6) / 46;
                  if (d < 0.55 * r + 0.4 * hash(by * 97 + bx))
                    ctx.drawImage(hubCv, bx * B, by * B, B, B, bx * B, by * B, B, B);
                }
            }
            // the strip's lines fade in whole over the dissolve, never cut by a block
            gameStrip(T, ease(d), ease((t - e0) / 0.4));
          }
          if (o < 1.0) {
            const R = scr(T, { x: px, y: py, w: 0, h: 0 });
            portalRing(R.x, R.y, lerp(1500, 0, ease(o / 1.0)), t, () => {
              UI_A = clamp(1 - o / 0.25);
              sceneBoss(CUTS[3] - 0.01);
              UI_A = 1;
            });
          }
          // the clean title holds with PRESS START blinking (1.5 s on the frame clock), then the
          // end card slides up from the bottom with the strip's QR call, holds for about 5 s and
          // fades; the extra life fades over the last 1.5 s, so the last frame is the game's title
          // screen with the call and its QR code on the strip
          const out = clamp((DUR - OUTRO_FADE_END - t) / (1.5 / PACE));
          if (d >= 1) titleLife(T, t, clamp((o - PRESS_AT - DISSOLVE) / 0.4) * out);
          endCard(ease((t - e0) / 0.4), clamp((e0 + CARD_HOLD - t) / (0.6 / PACE)));
        }

        function scene(t) {
          if (t < CUTS[0]) sceneHubIntro(t);
          else if (t < CUTS[1]) sceneMap(t);
          else if (t < CUTS[2]) sceneRooms(t);
          else if (t < CUTS[3]) sceneBoss(t);
          else sceneHubOutro(t);
        }
        // An iris around a cut, the portal's ring: the scene before the cut holds its last frame
        // while its texts fade, the ring opens on the scene after it from the centre, and that
        // scene's texts fade in once the ring has filled the frame
        function draw(t) {
          ctx.imageSmoothingEnabled = false;
          ctx.clearRect(0, 0, 1920, 1080);
          UI_A = 1;
          const c = WIPES.find((c) => Math.abs(t - c) < 0.35);
          if (c === undefined) return scene(t);
          const p = (t - c + 0.35) / 0.7;
          UI_A = clamp(1 - p / 0.2);
          scene(Math.min(t, c - 0.001));
          portalRing(960, 540, lerp(0, 1150, ease((p - 0.2) / 0.65)), t, () => {
            UI_A = clamp((p - 0.85) / 0.15);
            scene(Math.max(t, c));
          });
          UI_A = 1;
        }

        const clock = { t: 0 };
        Promise.all([
          hubImg.decode(),
          hub960.decode(),
          custLogo.decode(),
          hubMask.decode(),
          baseImg.decode(),
          giftImg.decode(),
          BOSS_IMG.menacing.decode(),
          BOSS_IMG.friendly.decode(),
          ...backdropLoads,
          ...spriteLoads,
          document.fonts.load(`8px ${PIXEL}`, "PRESS START 2027 ÄÖÜäöüß¡·"),
        ]).then(() => {
          findLights();
          buildMask();
          buildCells();
          // the render fails rather than cut a team name: shorten it in the customer's teams
          const tags = slots("tag");
          const free = tags.filter((t) => t.text === undefined).length;
          if (TEAMS.length > free)
            throw new Error(`more teams than gift tags (${free}): ${TEAMS.slice(free).join(" | ")}`);
          const tooLong = [...TEAMS, ...tags.map((t) => t.text ?? "")].filter(
            (n) => tags.length && !tagFit(n, Math.min(...tags.map((t) => cellOf(t).w))),
          );
          if (tooLong.length) throw new Error(`gift tag text too long: ${tooLong.join(" | ")}`);
          // a layout from before ink lines and logo grounds were removed, or a plate with no text,
          // stops the render rather than draw something else
          const stale = (HUB.slots ?? []).filter(
            (s) =>
              s.ink !== undefined ||
              (s.kind === "logo" && s.bg !== undefined) ||
              (s.kind === "label" && !s.text),
          );
          if (stale.length)
            throw new Error(
              `layout slot with a removed key (ink, logo bg) or a label without text: ${stale.map((s) => JSON.stringify(s)).join(" | ")}`,
            );
          // and rather than fall back to ink lines on a plate or board: shorten the text
          const plates = (HUB.slots ?? []).flatMap((s) =>
            s.kind === "label"
              ? [[s, s.text, 6, true]]
              : s.kind === "board"
                ? [[s, boardText(s), 4]]
                : s.kind === "doorsign"
                  ? [[s, V.doorTitle, 4]]
                  : [],
          );
          const unfit = plates.filter(([s, text, m, lit]) => text && !labelFit(cellOf(s), text, m, lit));
          if (unfit.length) throw new Error(`plate text does not fit: ${unfit.map((p) => p[1]).join(" | ")}`);
          // and rather than run a leader line through another tag's plate: shorten nothing, but
          // the render stops where no rows keep every line clear
          const crowded = stops.filter((s, r) => tagsOf(r, 0, 0).some((L) => L.bad));
          if (crowded.length)
            throw new Error(
              `ground tags with no rows clear of each other's lines: ${crowded.map((s) => s.place).join(" | ")}`,
            );
          // and rather than cover the wizard or a board, or shrink a line under the phone minimum:
          // the end card fits its space, every word on its width
          const card = cardLines();
          if (CARD.y1 - cardH(card) < CARD.top || card.some(([s, k]) => measure(s, 32, k) > CARD_ROOM))
            throw new Error(
              `end card too tall or a word too wide for its space beside the wizard: shorten customerName, greeting, nod or kitLine`,
            );
          // and rather than cartwheel through someone or off the frame's edge: the crosser needs
          // a room without a walker and, left of where the hero waits, twice its own width (a
          // visitor stands right of that span)
          const cr = EGG.crosser;
          if (cr && SP[cr.art] && (EGG.walker?.r === cr.r || heroWait(cr.r) - 8 < 2 * SP[cr.art].w))
            throw new Error(
              `crosser in room ${cr.room}: it needs a room without a walker, the hero waiting twice its width in`,
            );
          // and rather than show a film without a room: stop1Place names the first stop
          if (!stops.length) throw new Error("no stop: set stop1Place (an empty stopNPlace drops that stop)");
          // and rather than show a stop where nobody speaks: every stop has a trainer and a line, a
          // room in two places with two trainers a line for each
          const mute = stops.filter((s) => !s.npcs.length || !s.line || (twoBeats(s) && !s.line2));
          if (mute.length)
            throw new Error(
              `stop without a trainer and a line (or, in two places with two trainers, line 2): ${mute.map((s) => s.place).join(" | ")}`,
            );
          // and rather than guess a trainer's look or show two trainers as one person: give each
          // its own look in trainerLooks
          const trainers = [...new Set(stops.flatMap((s) => s.npcs))];
          const bare = trainers.filter((n) => !Number.isInteger(lookOf(n)));
          if (bare.length)
            throw new Error(`trainer without a look 0-13 in trainerLooks: ${bare.join(" | ")}`);
          const twins = trainers.filter((n, k) =>
            trainers.some((o, j) => j !== k && lookOf(o) === lookOf(n)),
          );
          if (twins.length) throw new Error(`trainers share a look: ${twins.join(" | ")}`);
          const tl = gsap.timeline({ paused: true });
          tl.fromTo(
            clock,
            { t: 0 },
            {
              t: DUR * PACE,
              duration: DUR * PACE,
              ease: "none",
              onUpdate: () => draw(clock.t / PACE),
            },
            0,
          );
          draw(0);
          window.__timelines["main"] = tl;
        });
      })();
    </script>
  </body>
</html>
